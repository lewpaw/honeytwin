[project]
name = "honeytwin"
version = "0.1.0"
description = "nmap-scan-driven honeypot twin generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",
    "docker>=7.0,<8.0",
]

[project.scripts]
honeytwin = "honeytwin.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honeytwin"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-html>=4.2.0",
    "ruff>=0.6,<1.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real nmap binary and/or Docker daemon",
]
